# Git hooks for `prek` (https://prek.j178.dev); CI runs the commit stage too. Install: `uv run prek install`.
# Local `uv run` hooks, not the tools' hook repos, so versions come from uv.lock as in CI.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit"]
default_env = { UV_LOCKED = "1" }  # as in CI: a stale uv.lock fails instead of being rewritten

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-merge-conflict" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
    { id = "no-commit-to-branch" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --fix", language = "system", types_or = ["python", "pyi"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types_or = ["python", "pyi"] },
    { id = "ty", name = "ty check", entry = "uv run ty check", language = "system", types_or = ["python", "pyi"], pass_filenames = false },
    { id = "adr-check", name = "adr check", entry = "uv run adr check --strict", language = "system", files = '^docs/adr/', pass_filenames = false },
    { id = "zizmor", name = "zizmor", entry = "uv run zizmor --min-severity=low .github/workflows", language = "system", files = '^\.github/workflows/', pass_filenames = false },
    { id = "commitizen", name = "conventional commit message", entry = "uv run cz check --commit-msg-file", language = "system", stages = ["commit-msg"] },
    { id = "pytest", name = "pytest with coverage floor", entry = "uv run pytest -q --cov", language = "system", pass_filenames = false, stages = ["pre-push"] },
    # Diff from the fork point, so commits on main since then are not counted as this branch's changes.
    { id = "adr-trailers", name = "adr check: ADR trailers since origin/main", entry = "sh -c 'uv run adr check --strict --diff \"$(git merge-base origin/main HEAD)\"'", language = "system", pass_filenames = false, stages = ["pre-push"] },
    { id = "docs", name = "zensical build", entry = "uv run --group docs zensical build --clean --strict", language = "system", files = '^(docs/|src/|README\.md$|zensical\.toml$)', pass_filenames = false, stages = ["pre-push"] },
]
