[project]
name = "adrinaline"
dynamic = ["version"]
description = "Git-native Architecture Decision Records for humans and coding agents"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Max Wolf" }]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pydantic>=2.14.1",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Repository = "https://github.com/maximiliancw/adrinaline"
Issues = "https://github.com/maximiliancw/adrinaline/issues"

[project.scripts]
adr = "adrinaline.cli:run"
adrinaline = "adrinaline.cli:run"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    { include-group = "release" },
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
    "ty>=0.0.92",
    "zizmor==1.31.1",
]
release = ["commitizen>=4.19.3"]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.73",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
major_version_zero = true

[tool.uv]
required-version = "==0.13.5"  # setup-uv installs this in CI; uv audit is still experimental
preview-features = ["audit-command"]

[tool.pytest]
testpaths = ["tests"]
strict = true
addopts = ["-ra", "-n", "auto"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["adrinaline"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 97
