name: release

# Every push to main releases if its commits warrant a bump (feat, fix, breaking).
# The version lives only in the git tag (hatch-vcs); nothing is committed back.
# The maintainer approves each release in the `release` environment before the
# tag is pushed (ADR 0007); a rejected release leaves no tag and no package.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: false  # never build a release from a restored cache
      - name: Next version
        id: next
        run: |
          set +e
          next=$(uv run cz bump --get-next --yes)
          code=$?
          set -e
          if [ "$code" = 21 ]; then exit 0; fi  # nothing to release
          [ "$code" = 0 ] || exit "$code"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG"  # local only, so hatch-vcs builds this version
          uv build
          mkdir release
          uv run cz changelog "$TAG" --dry-run > release/notes.md
          uv export --format cyclonedx1.5 --no-dev --frozen > release/sbom.cdx.json
          prev=$(git describe --tags --abbrev=0 HEAD^)
          fence() { echo "$1"; echo '```'; "${@:2}"; echo '```'; }
          {
            echo "## Release $TAG from $GITHUB_SHA"
            fence "Commits since $prev:" git log --oneline "$prev..HEAD"
            fence "Workflow changes since $prev (should be empty unless you made them):" git diff --stat "$prev..HEAD" -- .github
            fence "Artifacts:" sha256sum dist/*
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.next.outputs.tag
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - if: steps.next.outputs.tag
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  tag:
    needs: build
    if: needs.build.outputs.tag
    runs-on: ubuntu-latest
    environment: release  # required reviewer: the maintainer approves here
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.build.outputs.tag }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

  publish:
    needs: tag
    runs-on: ubuntu-latest
    environment: pypi  # trusted publisher; deployments limited to main
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: uv publish

  github-release:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md sbom.cdx.json
