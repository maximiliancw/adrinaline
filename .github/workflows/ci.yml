name: ci

# Checks run on PRs only; branch protection requires an up-to-date branch,
# so the commit that lands on main is the one that was tested.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - if: matrix.os == 'ubuntu-latest'
        run: uv run zizmor --min-severity=low .github/workflows
      - run: uv run cz check --rev-range "origin/$BASE_REF..HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest -q --cov
      - if: matrix.os == 'ubuntu-latest'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - run: uv run adr check --strict
