name: ci

# Checks run on PRs only; branch protection requires an up-to-date branch,
# so the commit that lands on main is the one that was tested.
on:
  pull_request:

permissions:
  contents: read

env:
  UV_LOCKED: 1

# A new push to a PR cancels its outdated run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # cz check reads the PR's commits
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The commit-stage hooks of prek.toml: hygiene, ruff, ty, adr check, zizmor.
      - run: uv run prek run --all-files --show-diff-on-failure
      - run: uv run cz check --rev-range "origin/$BASE_REF..HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}
      # Dependabot cannot add ADR trailers, and a version bump records no decision.
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: uv run adr check --strict --diff "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: uv audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --group docs zensical build --clean --strict

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # hatch-vcs and the git tests need tags and history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run pytest -q --cov
      - if: matrix.os == 'ubuntu-latest'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
